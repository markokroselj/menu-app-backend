name: menu-converter

services:
  pdf-to-txt:
    image: ghcr.io/markokroselj/menu-app-backend/pdfminer:1.0.0
    container_name: pdf-to-txt
    volumes:
      - ./data:/data

  txt-to-json:
    image: ghcr.io/markokroselj/menu-app-backend/txt-to-json:1.0.0
    container_name: text-to-json
    command: [ "/data/input.txt", "/data/output.json" ]
    volumes:
      - ./data:/data
    depends_on:
      pdf-to-txt:
        condition: service_completed_successfully

  deployment:
    image: ghcr.io/markokroselj/menu-app-backend/deployment:1.0.0
    container_name: deployment
    volumes:
      - ./data:/data
    env_file:
      - .env
    depends_on:
      txt-to-json:
        condition: service_completed_successfully
  
  clean-up:
    image: busybox:1.38.0
    volumes:
      - ./data:/data
    command: [ "sh", "-c", "find /data -mindepth 1 -delete" ]
    depends_on:
      deployment:
        condition: service_completed_successfully
